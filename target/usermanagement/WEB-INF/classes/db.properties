# ====================================================================
# Database Configuration File
# Supports MySQL with automatic self-healing fallback to embedded H2 (MySQL Mode)
# ====================================================================

# Database Connection Details
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/user_mgmt_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
db.user=root
db.password=root

# HikariCP Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=5000
db.pool.maxLifetime=1800000

# Fallback Settings: If MySQL is not reachable on localhost:3306, automatically fallback to in-memory H2 MySQL-mode
db.fallback.enabled=true
